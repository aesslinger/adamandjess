<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hello there and welcome to our little spot on the Internet.">
  <meta name="theme-color" content="#0d1117">
  <title>adamandjess.com</title>
  <style>
    :root {
      --blue: #6ac1e6;
      --bg: #0d1117;
      --text: #c9d1d9;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse at top, #161d29 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex;
      align-items: center;
      gap: 15px; 
      border-bottom: 1px solid rgba(106, 193, 230, 0.2);
    }
    header img {
      width: 55px;
      height: auto;
    }
    h1 {
      margin: 0;
      color: var(--blue);
      font-size: clamp(1.5rem, 5vw, 2.75rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      overflow-wrap: anywhere;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    .card {
      max-width: 36rem;
      text-align: center;
    }
    .card .lead {
      margin: 0 0 1.25rem;
      color: #fff;
      font-size: clamp(1.25rem, 3vw, 1.6rem);
      font-weight: 400;
    }
    .card p { margin: 0 0 1rem; font-size: 1.1rem; }
    .rule {
      width: 3rem;
      height: 2px;
      margin: 0 auto 1.5rem;
      background: var(--blue);
      border: 0;
    }
    footer {
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <header>
    <img src="assets/family4-small.png" alt="Adam, Jess, Mason and Reid">
    <h1>adamandjessandmasonandreid</h1>
  </header>
  <main>
    <section class="card">
      <p class="lead">Hello there and welcome to our little spot on the Internet.</p>
      <p>There used to be a lot more here. Some day there may be again. Thanks for stopping by!</p>
    </section>
  </main>
  <footer>
    <p style="margin:0">&copy; <script>document.write(new Date().getFullYear())</script> adamandjess.com</p>
  </footer>
</body>
</html>
